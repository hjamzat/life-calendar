name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the site at the deployed worker
        if: ${{ vars.WORKER_URL != '' }}
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          cat > site/config.js <<EOF
          const local = ["localhost", "127.0.0.1"].includes(location.hostname);
          export const WORKER_URL = local
            ? "http://localhost:8787"
            : "${WORKER_URL%/}";
          EOF

      # Pages lets browsers cache files for 10 minutes; without versioned URLs a
      # fresh index.html can load stale app.js/lib modules. Stamp each deploy.
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          assets='(src|href)="(app\.js|style\.css)"'
          sed -i -E "s#$assets#\1=\"\2?v=$v\"#g" site/index.html
          mods='from "\./(config|lib/calendar|lib/render)\.js"'
          sed -i -E "s#$mods#from \"./\1.js?v=$v\"#g" site/app.js
          grep -q "app.js?v=$v" site/index.html
          test "$(grep -c "?v=$v" site/app.js)" -eq 3
          sed -i -E "s#from \"\./tz-cities\.js\"#from \"./tz-cities.js?v=$v\"#" site/lib/calendar.js
          grep -q "tz-cities.js?v=$v" site/lib/calendar.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
